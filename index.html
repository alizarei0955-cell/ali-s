<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>NEXUS ENGINEER AI</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#26364d;--text:#edf4ff;--muted:#9aabc2;--accent:#40d9c2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b42,var(--bg) 65%);font-family:Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:18px}.app{width:min(900px,100%);display:flex;flex-direction:column;min-height:calc(100vh - 36px);border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(11,18,32,.94)}header{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent);color:#06201f;font-weight:bold;font-size:22px}h1{font-size:20px;margin:0 0 6px}header p{margin:0;color:var(--muted);font-size:13px}.status{margin-right:auto;color:var(--accent);font-size:12px}.messages{padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto}.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.bubble.user{align-self:flex-start;background:#153b43;border-color:#23635f}.bubble.bot{align-self:flex-end}.welcome{color:var(--muted);font-size:13px;text-align:center;margin:20px 0}.composer{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;background:#0d1727}textarea{resize:vertical;min-height:48px;max-height:160px;flex:1;background:#111c2e;border:1px solid var(--line);border-radius:13px;color:var(--text);font:inherit;padding:13px;outline:none}textarea:focus{border-color:var(--accent)}button{border:0;border-radius:13px;padding:0 20px;background:var(--accent);color:#06201f;font-weight:bold;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:11px;color:var(--muted);padding:0 16px 12px}@media(max-width:520px){body{padding:0}.app{min-height:100vh;border-radius:0;border:0}.bubble{max-width:95%}header{padding:15px}.status{display:none}}
</style></head>
<body><main class="app"><header><div class="logo">N</div><div><h1>NEXUS ENGINEER AI</h1><p>دستیار هوشمند الکترونیک، تعمیرات و برنامه‌نویسی</p></div><div class="status">● آماده</div></header><section id="messages" class="messages" aria-live="polite"><div class="welcome">سلام! سؤال فنی‌ات رو بنویس تا با هم بررسی کنیم. ⚡</div></section><form id="form" class="composer"><textarea id="input" placeholder="پیامت رو بنویس..." aria-label="پیام" required></textarea><button id="send" type="submit">ارسال</button></form><div class="hint">برای ارسال از دکمه استفاده کن. پاسخ‌ها ممکن است به کلید API و اعتبار سرویس نیاز داشته باشند.</div></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages');const history=[];
function addBubble(text,who){const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el;}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;input.value='';addBubble(text,'user');history.push({role:'user',content:text});send.disabled=true;send.textContent='...';const waiting=addBubble('در حال فکر کردن…','bot');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await res.json();waiting.remove();if(!res.ok)throw new Error(data.error||'درخواست ناموفق بود');addBubble(data.reply,'bot');history.push({role:'assistant',content:data.reply});}catch(err){addBubble('خطا: '+err.message,'bot');history.pop();}finally{send.disabled=false;send.textContent='ارسال';input.focus();}});
</script></body></html>
